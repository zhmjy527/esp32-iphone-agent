name: Build ESP32 Agent (firmware + unsigned IPA)
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - name: Install esp32 core and NimBLE
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build firmware
        run: hardware/flash.sh --build-only
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-agent-firmware
          path: hardware/build/

  app:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild build -project IPhoneAgent.xcodeproj -scheme IPhoneAgent -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build | tail -25
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -qr ESP32Agent-unsigned.ipa Payload
          ls -la ESP32Agent-unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-unsigned-ipa
          path: ios/ESP32Agent-unsigned.ipa
